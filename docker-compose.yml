# Local PostgreSQL for the Elev8 app. Replaces the hosted Supabase database.
services:
  postgres:
    image: postgres:16-alpine
    container_name: elev8-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elev8
    ports:
      # 5433 on the host: port 5432 is commonly already taken by a locally
      # installed PostgreSQL. Inside the container it is still 5432.
      - "5433:5432"
    volumes:
      - elev8-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elev8"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elev8-pgdata:
